<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Mails schreiben üben</title>
<style>
:root{--bg:#f2f6fa;--card:#fff;--ink:#1f2a37;--mut:#52606d;--ac:#0f766e;--acbg:#d9f0ed;--ok:#166534;--okbg:#dcf5e3;--no:#92400e;--nobg:#fdecd2;--ln:#c5d0db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--card:#1b2631;--ink:#eef3f7;--mut:#a9b7c4;--ac:#5eead4;--acbg:#12423e;--ok:#86efac;--okbg:#153a24;--no:#fcd34d;--nobg:#3d2f10;--ln:#33455a}}
:root[data-theme="dark"]{--bg:#121a22;--card:#1b2631;--ink:#eef3f7;--mut:#a9b7c4;--ac:#5eead4;--acbg:#12423e;--ok:#86efac;--okbg:#153a24;--no:#fcd34d;--nobg:#3d2f10;--ln:#33455a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 Verdana,Tahoma,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.25rem;margin:.2em 0 .5em}
.card{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:18px;margin:14px 0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
label{font-weight:bold;display:block;margin:.6em 0 .2em}
input,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px}
button{font:inherit;cursor:pointer;border:2px solid var(--ac);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;margin:4px 4px 4px 0}
button.p{background:var(--ac);color:var(--bg);font-weight:bold}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--ac);outline-offset:2px}
.tabs button{padding:8px 12px;font-size:.9rem}.tabs button[aria-current=true]{background:var(--acbg);font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}
.fb{padding:12px;border-radius:10px;margin:10px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.mail{border:2px solid var(--ln);border-radius:10px;padding:12px;background:var(--bg)}
.part{display:block;width:100%;text-align:left;margin:6px 0;border-style:dashed}
.small{color:var(--mut);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{border:1px solid var(--ln);padding:6px 8px;text-align:left}
.chk li{margin:.4em 0;list-style:none}ul.chk{padding:0}
@media(prefers-reduced-motion:no-preference){.fb{transition:opacity .2s}}
</style></head><body><main>
<div class="top"><h1>E-Mails schreiben üben</h1></div>
<div class="card"><label for="nm">Dein Name</label><input id="nm" autocomplete="off" spellcheck="false" placeholder="Hier deinen Namen schreiben">
<p id="sum" class="small" style="margin-bottom:0"></p></div>
<nav class="tabs" id="tabs"></nav>
<div id="v"></div>
</main>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),st={};
const M={
aufbau:{t:"1 Aufbau",learn:`<h2>Aus welchen Teilen besteht eine E-Mail?</h2><p>Tippe auf einen Teil. Dann siehst du die Erklärung.</p>
<div class="mail">${[["An: anna@mail.at","An","Hier steht die E-Mail-Adresse von der Person, die deine E-Mail bekommt."],["Betreff: Hausübung Mathe","Betreff","Der Betreff sagt kurz: Worum geht es? Schreibe 2 bis 4 Wörter."],["Hallo Anna,","Anrede","Damit sprichst du die Person an. Nach der Anrede kommt ein Komma."],["Ich habe eine Frage zur Hausübung. Kannst du mir helfen?","Text","Hier schreibst du deine Nachricht. Kurze Sätze sind gut."],["Liebe Grüße<br>Max","Gruß und Name","Am Ende sagst du Tschüss und schreibst deinen Namen."]].map(p=>`<button class="part" data-i="${p[1]}|${p[2]}">${p[0]}</button>`).join("")}</div><div id="ex" class="fb ok" aria-live="polite">Tippe oben auf einen Teil.</div>`,
items:[["„Hallo Anna,“ – Was ist das?",["Anrede","Betreff","Gruß","Text"],0,"Die Anrede steht am Anfang."],["„Hausübung Mathe“ – Was ist das?",["Betreff","Anrede","Gruß","Text"],0,"Der Betreff sagt kurz, worum es geht."],["Du schreibst an Herrn Müller: herrmueller@schule.at. Was steht im Feld „An“?",["herrmueller@schule.at","Herr Müller","Sehr geehrter Herr Müller","Hausübung"],0,"Im Feld „An“ steht nur die E-Mail-Adresse."],["Du schreibst an deinen Opa: opa@opa.at. Was steht in der Anrede?",["Lieber Opa,","opa@opa.at","Sehr geehrter Opa,","Betreff: Opa"],0,"Die Adresse steht im Feld „An“. In der Anrede steht „Lieber Opa,“."],["Was schreibst du in das Feld „An“?",["Die E-Mail-Adresse der Person","Deinen Namen","Den Betreff","Ein Bild"],0,"Im Feld „An“ steht die Adresse von der Person, die die E-Mail bekommt."],["„Liebe Grüße, Max“ – Was ist das?",["Gruß und Name","Anrede","Betreff","Adresse"],0,"Der Gruß steht am Ende."],["„Ich habe eine Frage zur Hausübung.“ – Was ist das?",["Text","Anrede","Betreff","Gruß"],0,"Das ist die Nachricht, also der Text."],["Was kommt direkt nach der Anrede?",["Der Text","Der Gruß","Der Betreff","Die Adresse"],0,"Erst Anrede, dann Text, dann Gruß."],["Was steht ganz am Ende der E-Mail?",["Gruß und dein Name","Der Betreff","Die Anrede","Die Adresse"],0,"Am Ende: Gruß und dein Name."],["Welcher Teil sagt kurz, worum es in der E-Mail geht?",["Der Betreff","Der Gruß","Die Anrede","Der Name"],0,"Der Betreff steht oben und ist kurz."]]},
dusie:{t:"2 Du oder Sie?",learn:`<h2>Wem schreibe ich?</h2><table><tr><th></th><th>du-Form (persönlich)</th><th>Sie-Form (höflich)</th></tr><tr><td>Wem?</td><td>Freund*innen, Familie, Mitschüler*innen</td><td>Lehrer*innen, Direktion, Firmen, Ämter, fremde Erwachsene</td></tr><tr><td>Anrede</td><td>Hallo Anna,<br>Liebe Anna,</td><td>Sehr geehrte Frau Berger,<br>Sehr geehrter Herr Huber,</td></tr><tr><td>Gruß</td><td>Liebe Grüße</td><td>Mit freundlichen Grüßen</td></tr></table>`,
items:[["Du schreibst an deine beste Freundin. Welche Form?",["du-Form","Sie-Form"],0,"Freund*innen duzt man."],["Du schreibst an deine Lehrerin Frau Berger.",["Sie-Form","du-Form"],0,"Lehrer*innen siezt man in einer E-Mail."],["Du schreibst an den Direktor Herrn Huber.",["Sie-Form","du-Form"],0,"Direktion: Sie-Form."],["Du schreibst an deine Oma.",["du-Form","Sie-Form"],0,"Familie duzt man."],["Du schreibst an eine Firma, weil du ein Praktikum suchst.",["Sie-Form","du-Form"],0,"Firmen: Sie-Form."],["Du schreibst an deinen Mitschüler Tim.",["du-Form","Sie-Form"],0,"Mitschüler*innen duzt man."],["Du schreibst an die Bürgermeisterin.",["Sie-Form","du-Form"],0,"Personen in Ämtern: Sie-Form."],["Du schreibst an deinen Cousin.",["du-Form","Sie-Form"],0,"Familie: du-Form."]]},
anrede:{t:"3 Anrede und Gruß",learn:`<h2>Die richtige Anrede und der richtige Gruß</h2><p><b>Herr</b> → Sehr geehrter Herr Huber,<br><b>Frau</b> → Sehr geehrte Frau Meier,<br><b>Freund*in</b> → Hallo Tim, / Liebe Lena, / Lieber Tim,</p><p>Nach der Anrede steht ein <b>Komma</b>. Der Text beginnt danach <b>klein</b>, wenn das Wort kein Nomen ist.</p>`,
items:[["An Frau Berger. Welche Anrede passt?",["Sehr geehrte Frau Berger,","Hallo Berger,","Hey Frau!","Liebe Berger,"],0,"Frau → „Sehr geehrte“."],["An Herrn Huber. Welche Anrede passt?",["Sehr geehrter Herr Huber,","Sehr geehrte Herr Huber,","Hallo Herr Huber,","Lieber Herr Huber,"],0,"Herr → „Sehr geehrter“ (mit -r)."],["An deine Freundin Lena.",["Liebe Lena,","Lieber Lena,","Sehr geehrte Lena,","Guten Tag Lena,"],0,"Mädchen → „Liebe“."],["An deinen Freund Tim.",["Lieber Tim,","Liebe Tim,","Sehr geehrter Tim,","Sehr geehrte Tim,"],0,"Bub → „Lieber“."],["Welcher Gruß ist höflich (Sie-Form)?",["Mit freundlichen Grüßen","LG","Bis dann!","Ciao"],0,"Höflich: „Mit freundlichen Grüßen“."],["Welcher Gruß passt zu einer Freundin?",["Liebe Grüße","Mit freundlichen Grüßen","Sehr geehrte Damen und Herren","Hochachtungsvoll"],0,"Persönlich: „Liebe Grüße“."],["An Frau Meier (Bibliothek). Welche Anrede passt?",["Sehr geehrte Frau Meier,","Sehr geehrter Frau Meier,","Hallo Frau Meier!","Liebe Frau Meier,"],0,"Frau → „Sehr geehrte“ (mit -e)."],["Was steht nach der Anrede?",["Ein Komma","Ein Punkt","Ein Fragezeichen","Nichts"],0,"Nach der Anrede kommt ein Komma."]]},
pron:{t:"4 du / Sie",learn:`<h2>Die Wörter für du und Sie</h2><table><tr><th>Fall</th><th>Frage</th><th>du</th><th>Sie</th></tr><tr><td>1. Fall</td><td>wer?</td><td>du</td><td>Sie</td></tr><tr><td>2. Fall</td><td>wessen?</td><td>dein, deine</td><td>Ihr, Ihre</td></tr><tr><td>3. Fall</td><td>wem?</td><td>dir</td><td>Ihnen</td></tr><tr><td>4. Fall</td><td>wen?</td><td>dich</td><td>Sie</td></tr></table><p class="small">Beispiele: Ich danke <b>dir</b> / <b>Ihnen</b> (wem?). Ich frage <b>dich</b> / <b>Sie</b> (wen?). <b>Deine</b> / <b>Ihre</b> Nachricht (wessen Nachricht?).</p><p class="small">Bei Sie schreibt man <b>Sie, Ihnen, Ihr</b> immer mit großem Anfangsbuchstaben.</p>`,
items:[["Frau Berger, können ___ mir helfen?",["Sie","du","dir","dich"],0,"Frau Berger → Sie-Form. „Sie“ mit großem S."],["Lena, kannst ___ morgen kommen?",["du","Sie","Ihnen","Ihr"],0,"Lena ist eine Freundin → du."],["Herr Huber, ich danke ___ für die Antwort.",["Ihnen","dir","Sie","Ihr"],0,"danken + wem? → Ihnen."],["Tim, ich danke ___ für die Einladung.",["dir","Ihnen","dich","Sie"],0,"danken + wem? → dir."],["Frau Meier, ich habe ___ Nachricht gelesen.",["Ihre","Deine","Dein","Ihr"],0,"die Nachricht → Ihre (Sie-Form)."],["Anna, vielen Dank für ___ Nachricht!",["deine","Ihre","dein","Sie"],0,"Anna → du-Form → deine."],["Herr Huber, wie geht es ___?",["Ihnen","dir","Sie","Ihr"],0,"Wie geht es wem? → Ihnen."],["Oma, wie geht es ___?",["dir","Ihnen","Sie","dich"],0,"Oma → du-Form → dir."],["Frau Berger, ich möchte ___ etwas fragen.",["Sie","dir","Ihnen","dich"],0,"jemanden fragen → Sie."],["Frau Berger, ich schicke ___ die Hausübung.",["Ihnen","Sie","dir","Ihr"],0,"schicken + wem? → Ihnen."]]}};
const SC=[{f:"du",who:"deine Freundin Lena",n:"Lena",e:"lena@mail.at",task:"Lade Lena zu deinem Geburtstag am Samstag ein.",h:"Ich habe am Samstag Geburtstag. Kommst du? Wir treffen uns um …"},
{f:"Sie",who:"deine Lehrerin Frau Berger",n:"Berger",e:"frauberger@schule.at",task:"Du warst krank. Frage, was du als Hausübung machen musst.",h:"Ich war gestern krank. Können Sie mir bitte sagen, …?"},
{f:"du",who:"dein Opa",n:"Opa",e:"opa@opa.at",task:"Erzähle deinem Opa, was du am Wochenende gemacht hast.",h:"Am Wochenende war ich … Wie geht es dir?"},
{f:"Sie",who:"Herr Huber, der Direktor",n:"Huber",e:"herrhuber@schule.at",task:"Du möchtest beim Schulfest helfen. Frage höflich, ob das geht.",h:"Ich möchte gern beim Schulfest helfen. Ist das möglich?"},
{f:"Sie",who:"Herr Müller, dein Sportlehrer",n:"Müller",e:"herrmueller@schule.at",task:"Du kannst am Freitag nicht zur Turnstunde kommen. Entschuldige dich höflich.",h:"Ich kann am Freitag leider nicht kommen. Bitte entschuldigen Sie …"},
{f:"du",who:"dein Mitschüler Tim",n:"Tim",e:"tim@mail.at",task:"Frage Tim, ob er dir das Buch leihen kann.",h:"Kannst du mir bitte das Buch … leihen? Danke im Voraus!"},
{f:"Sie",who:"Frau Meier von der Bibliothek",n:"Meier",e:"fraumeier@bibliothek.at",task:"Frage, wann die Bibliothek geöffnet hat.",h:"Können Sie mir bitte sagen, wann die Bibliothek geöffnet hat?"}];
function upd(){$("#tabs").innerHTML=[...Object.keys(M),"schr","ueb"].map(k=>`<button data-k="${k}" ${cur==k?'aria-current="true"':''}>${k=="ueb"?"6 Übersicht":k=="schr"?"5 Schreiben":M[k].t}${st[k]?" "+"⭐".repeat(st[k]):""}</button>`).join("");
$("#sum").textContent=Object.keys(st).length?"Meine Sterne: "+[...Object.keys(M),"schr"].map((k,i)=>(i+1)+": "+"⭐".repeat(st[k]||0)+(st[k]?"":"–")).join("   "):"Mache eine Übung. Dann siehst du hier deine Sterne.";}
let cur="aufbau";const L=[],now=()=>new Date().toLocaleString("de-AT"),nm=()=>($("#nm").value.trim()||"(ohne Name)");
function csv(){const q=x=>'"'+String(x).replace(/"/g,'""').replace(/\n/g," / ")+'"';return "\ufeff"+[["Name","Datum","Übung","Aufgabe / Frage","Antwort","Ergebnis","Hinweis"],...L.map(r=>[nm(),r.t,r.m,r.q,r.a,r.r,r.h||""])].map(r=>r.map(q).join(";")).join("\r\n");}
function ov(){const rows=Object.keys(M).map(k=>{const r=L.filter(x=>x.m==M[k].t);return `<tr><td>${M[k].t}</td><td>${r.length}</td><td>${r.filter(x=>x.r=="richtig").length}</td><td>${"⭐".repeat(st[k]||0)||"–"}</td></tr>`}).join(""),w=L.filter(x=>x.m=="Schreiben"),
c=x=>String(x).replace(/[\t\r\n]+/g," "),tx=[["Name","Datum","Übung","Aufgabe / Frage","Antwort","Ergebnis","Hinweis"],...L.map(r=>[nm(),r.t,r.m,r.q,r.a,r.r,r.h||""])].map(r=>r.map(c).join("\t")).join("\n");
$("#v").innerHTML=`<div class="card"><h2>Meine Übersicht</h2><p><b>${nm()}</b> · ${now()}</p><table><tr><th>Übung</th><th>Antworten</th><th>Richtig</th><th>Sterne</th></tr>${rows}<tr><td>5 Schreiben</td><td>${w.length} E-Mails</td><td>–</td><td>${"⭐".repeat(st.schr||0)||"–"}</td></tr></table></div>
<div class="card"><h2>Ergebnis abgeben</h2>${L.length?"":"<p>Mache zuerst eine Übung.</p>"}<p><b>Möglichkeit 1:</b> Datei speichern (Excel).</p><button class="p" id="dl">Datei speichern</button><p id="dm" class="small" aria-live="polite"></p>
<p><b>Möglichkeit 2:</b> Text kopieren und abschicken. In Excel eingefügt, entstehen Spalten.</p><textarea id="tx" readonly>${tx.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea><button id="cp">Text kopieren</button><p class="small">Möglichkeit 3: Mache einen Screenshot von dieser Seite.</p></div>`;
$("#dl").onclick=async()=>{const m=$("#dm");try{const d=window.claude&&await claude.use("downloads");if(!d){m.textContent="Speichern geht hier nicht. Nimm Möglichkeit 2 oder 3.";return}await d.save({filename:"E-Mail-Uebung_"+nm().replace(/\s+/g,"_")+".csv",data:csv()});m.textContent="Gespeichert! ✔"}catch(e){m.textContent=e&&e.code=="declined"?"Nicht gespeichert.":"Speichern hat nicht geklappt. Nimm Möglichkeit 2 oder 3."}};
$("#cp").onclick=()=>{const t=$("#tx");t.select();try{document.execCommand("copy");$("#cp").textContent="Kopiert ✔"}catch(e){}};}
function show(k){cur=k;upd();if(k=="ueb")return ov();if(k=="schr")return wr();const m=M[k];$("#v").innerHTML=`<div class="card">${m.learn}</div><div class="card"><h2>Übung</h2><p>${m.items.length} Fragen. Du kannst so oft üben, wie du willst.</p><button class="p" id="go">Übung starten</button></div>`;
$("#go").onclick=()=>quiz(k);document.querySelectorAll(".part").forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.i.split("|");const t=m.learn.match(new RegExp(c.replace("ß","ß")+"[^\\]]*?\\]"));const e={"An":"Hier steht die E-Mail-Adresse von der Person, die deine E-Mail bekommt.","Betreff":"Der Betreff sagt kurz: Worum geht es? Schreibe 2 bis 4 Wörter.","Anrede":"Damit sprichst du die Person an. Nach der Anrede kommt ein Komma.","Text":"Hier schreibst du deine Nachricht. Kurze Sätze sind gut.","Gruß und Name":"Am Ende sagst du Tschüss und schreibst deinen Namen."};$("#ex").textContent=c+": "+e[c];});}
function quiz(k){const it=sh(M[k].items),n=it.length;let i=0,ok=0;
function q(){const[t,o,a,w]=it[i],c=o[a];$("#v").innerHTML=`<div class="card"><p class="small">Frage ${i+1} von ${n}</p><h2>${t}</h2><div id="o">${sh(o).map(x=>`<button class="opt">${x}</button>`).join("")}</div><div id="f" aria-live="polite"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const r=b.textContent==c;if(r)ok++;L.push({t:now(),m:M[k].t,q:t,a:b.textContent,r:r?"richtig":"falsch",h:r?"":"Richtig wäre: "+c});document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==c)x.classList.add("ok");});if(!r)b.classList.add("no");
$("#f").innerHTML=`<div class="fb ${r?"ok":"no"}"><b>${r?"Richtig! ✔":"Fast. Richtig ist: "+c}</b><br>${w}</div><button class="p" id="nx">${i+1<n?"Weiter":"Fertig"}</button>`;$("#nx").focus();$("#nx").onclick=()=>{i++;i<n?q():end();};});}
function end(){const s=ok/n>=.9?3:ok/n>=.7?2:ok/n>=.4?1:0;st[k]=Math.max(st[k]||0,s);upd();$("#v").innerHTML=`<div class="card"><h2>Geschafft!</h2><p>${ok} von ${n} richtig. ${"⭐".repeat(s)||"Übe noch einmal, dann klappt es besser."}</p><button class="p" id="ag">Noch einmal üben</button><button id="bk">Zurück</button></div>`;$("#ag").onclick=()=>quiz(k);$("#bk").onclick=()=>show(k);}
q();}
function wr(){let s=SC[Math.floor(Math.random()*SC.length)];
$("#v").innerHTML=`<div class="card"><h2>Schreibe eine E-Mail</h2><p><b>Du schreibst an:</b> ${s.who}<br><b>E-Mail-Adresse:</b> ${s.e}<br><b>Form:</b> ${s.f=="du"?"du-Form":"Sie-Form"}<br><b>Aufgabe:</b> ${s.task}</p><button id="hb">Hilfe anzeigen</button><p id="hp" class="small" hidden>Satzanfang: „${s.h}“</p>
<label for="a">An (E-Mail-Adresse)</label><input id="a" autocomplete="off" spellcheck="false"><label for="b">Betreff</label><input id="b" autocomplete="off"><label for="c">Anrede</label><input id="c" autocomplete="off"><label for="d">Text</label><textarea id="d"></textarea><label for="e">Gruß</label><input id="e" autocomplete="off"><label for="g">Dein Name</label><input id="g" autocomplete="off">
<p><button class="p" id="ck">Prüfen</button><button id="nw">Neue Aufgabe</button></p><div id="r" aria-live="polite"></div></div>`;
$("#hb").onclick=()=>{$("#hp").hidden=false};$("#nw").onclick=wr;
$("#ck").onclick=()=>{const v=x=>$("#"+x).value.trim(),d=v("d"),du=s.f=="du",C=[];
const add=(o,t,h)=>C.push([o,t,h]);
add(v("a").toLowerCase()==s.e,"Richtige Adresse im Feld „An“","Schreibe genau diese Adresse ab: "+s.e+" (ohne Leerzeichen, alles klein).");
add(v("b").length>=3,"Betreff","Schreibe 2 bis 4 Wörter, worum es geht.");
add(du?/^(Hallo|Liebe|Lieber|Hi)\b/.test(v("c")):/^Sehr geehrte[rn]?\b/.test(v("c")),"Passende Anrede",du?"Zum Beispiel: Hallo Lena,":"Zum Beispiel: Sehr geehrte Frau Berger,");
add(v("c").toLowerCase().includes(s.n.toLowerCase()),"Name in der Anrede","Schreibe den Namen der Person in die Anrede.");
add(/[,]$/.test(v("c")),"Komma nach der Anrede","Nach der Anrede kommt ein Komma.");
add(d.split(/\s+/).filter(Boolean).length>=12,"Text lang genug","Schreibe mindestens 12 Wörter.");
const bad=du?/\b(Sie|Ihnen|Ihre[mnrs]?|Ihr)\b/.test(d.replace(/(^|[.!?]\s*)Sie\b/g,"$1")):/\b(du|dir|dich|dein\w*)\b/i.test(d);
add(!bad,du?"Nur du-Wörter im Text":"Nur Sie-Wörter im Text",du?"Benutze du, dir, dich, dein …":"Benutze Sie, Ihnen, Ihr … und schreibe sie groß.");
if(!du)add(!/\b(ihnen|ihre[mnrs]?)\b/.test(d),"Sie-Wörter groß geschrieben","Ihnen und Ihre schreibt man bei Sie groß.");
add(du?/(Grüße|Gruß|Tschüss|Bis bald|LG)/i.test(v("e")):/^(Mit freundlichen Grüßen|Freundliche Grüße)/.test(v("e")),"Passender Gruß",du?"Zum Beispiel: Liebe Grüße":"Zum Beispiel: Mit freundlichen Grüßen");
